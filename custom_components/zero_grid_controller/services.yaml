reset_pid:
  name: Reset PID
  description: Reset the PID integrator and derivative history.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID (optional; omit to reset all instances).
      required: false
      example: "abc123def456"
      selector:
        text:

recalibrate:
  name: Recalibrate
  description: Re-run automatic step-response calibration for one or all PV arrays.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID (optional; omit to recalibrate the loaded instance).
      required: false
      example: "abc123def456"
      selector:
        text:

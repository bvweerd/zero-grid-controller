reset_pid:
  name: Reset PID
  description: Reset the PID integrator and derivative history.
  fields:
    entry_id:
      name: Entry ID
      description: Config entry ID (optional; omit to reset all instances).
      required: false
      example: "abc123def456"
      selector:
        text:

recalibrate:
  name: Recalibrate
  description: Re-run automatic step-response calibration for one or all PV arrays.
  fields:
    array_name:
      name: Array name
      description: Name of the array to calibrate. Leave empty to calibrate all arrays.
      required: false
      example: "Roof South"
      selector:
        text:

set_response_speed:
  name: Set response speed
  description: Set the controller response speed (alternative to the options UI slider).
  fields:
    speed:
      name: Speed
      description: "Response speed preset: cautious, normal, or fast."
      required: true
      example: "normal"
      selector:
        select:
          options:
            - "cautious"
            - "normal"
            - "fast"

override_setpoint:
  name: Override setpoint
  description: >
    Force a specific setpoint for one array, bypassing the PID controller
    for up to 5 minutes. Useful for testing or manual override.
  fields:
    array_name:
      name: Array name
      description: Name of the array to override.
      required: true
      example: "Roof South"
      selector:
        text:
    value:
      name: Value
      description: Setpoint value (percentage or Watts, matching the array's output type).
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 100000
          step: 1

rules:
  # Bronze
  action-setup:
    status: done
    comment: >
      Two service actions registered in __init__.py: reset_pid and recalibrate.
      Defined in services.yaml.
  appropriate-polling:
    status: done
    comment: >
      DataUpdateCoordinator with a 5-second update interval, appropriate for
      real-time grid power control.
  brands:
    status: done
    comment: >
      icon.png and logo.png placed in custom_components/zero_grid_controller/brand/
      (served by HA via /api/brands/integration/zero_grid_controller/ since 2026.3).
  common-modules:
    status: done
    comment: >
      pid.py (PID controller), array.py (array dataclass),
      calibrator.py (calibration logic), battery.py, load.py,
      control_engine.py (pure control logic), sensor_reader.py (protocol),
      actuator_manager.py, repairs.py, utils.py, const.py.
  config-flow-test-coverage:
    status: done
    comment: >
      tests/test_config_flow.py covers all wizard steps (user step, no-sensor
      validation, success), options flow, array subentry add/reconfigure/duplicate
      rejection, battery subentry add/reconfigure, empty-name validation,
      switch threshold validation, and name-helper unit tests (18 tests total).
  config-flow:
    status: done
    comment: >
      Wizard-style ConfigFlow for initial setup (grid sensors, deadband, EWM alpha,
      aggressiveness). Three ConfigSubentryFlow types: array, battery, load — each
      with add and reconfigure steps. OptionsFlow exposes the same main parameters
      as the initial setup wizard.
  dependency-transparency:
    status: done
    comment: >
      requirements: [] — no external PyPI packages. Only stdlib and
      Home Assistant built-in helpers.
  docs-actions:
    status: done
    comment: services.yaml documents both service actions with fields and examples.
  docs-high-level-description:
    status: done
    comment: README "What does it do?" section.
  docs-installation-instructions:
    status: done
    comment: README "Installation" section with HACS steps.
  docs-removal-instructions:
    status: done
    comment: README "Removal" section.
  entity-event-setup:
    status: done
    comment: >
      CoordinatorEntity pattern throughout; subscriptions via async_on_remove
      in async_added_to_hass (inherited from CoordinatorEntity).
  entity-unique-id:
    status: done
    comment: All entities — _attr_unique_id = f"{entry.entry_id}_{key}".
  has-entity-name:
    status: done
    comment: _attr_has_entity_name = True on all entity base classes.
  runtime-data:
    status: done
    comment: entry.runtime_data = ZGCData(...) in async_setup_entry.
  test-before-configure:
    status: exempt
    comment: >
      No external API or network dependency — integration reads HA sensor
      states only. No connection test needed before setup.
  test-before-setup:
    status: exempt
    comment: >
      No external dependency; coordinator reads HA states which are always
      available. ConfigEntryNotReady not applicable.
  unique-config-entry:
    status: done
    comment: >
      "single_config_entry": true in manifest.json ensures HA enforces uniqueness
      at the framework level; no second entry can be added after initial setup.

  # Silver
  action-exceptions:
    status: done
    comment: >
      Service handlers log errors for invalid inputs (unknown speed, missing
      array). HomeAssistantError raised for parameter validation.
  config-entry-unloading:
    status: done
    comment: >
      async_unload_entry calls async_unload_platforms and clears runtime_data.
  docs-configuration-parameters:
    status: done
    comment: README "Configuration" section describes all wizard parameters.
  docs-installation-parameters:
    status: done
    comment: README "Prerequisites" section.
  entity-unavailable:
    status: done
    comment: >
      CoordinatorEntity automatically marks entities unavailable when
      last_update_success=False. Sensors return None as native_value when
      coordinator.data is None.
  integration-owner:
    status: done
    comment: manifest.json codeowners — ["@bvweerd"].
  log-when-unavailable:
    status: done
    comment: >
      DataUpdateCoordinator built-in log-once: first failure logs at ERROR,
      subsequent at DEBUG, recovery at INFO.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 in sensor.py, number.py, switch.py.
  reauthentication-flow:
    status: exempt
    comment: No authentication required.
  test-coverage:
    status: done
    comment: >
      169 tests across pid.py, coordinator, control_engine, config_flow,
      calibration, actuator_manager, load control, array/battery config,
      entities (sensor, number, switch, button, binary_sensor), diagnostics,
      repairs, init, platform behaviours, simulation, and integration scenarios.

  # Gold
  devices:
    status: done
    comment: >
      Main device per config entry; per-array sub-device linked via via_device
      to the main device.
  diagnostics:
    status: done
    comment: diagnostics.py implements async_get_config_entry_diagnostics.
  discovery-update-info:
    status: exempt
    comment: No discoverable network devices.
  discovery:
    status: exempt
    comment: Integration reads HA sensor states; no device discovery applicable.
  docs-data-update:
    status: done
    comment: README "How does the self-tuning work?" section describes the update cycle.
  docs-examples:
    status: done
    comment: README "FAQ" and "Expert mode" sections with usage examples.
  docs-known-limitations:
    status: done
    comment: README "Frequently asked questions" section covers known edge cases.
  docs-supported-devices:
    status: exempt
    comment: >
      Software-only integration; works with any inverter controllable via
      a Home Assistant number or switch entity.
  docs-supported-functions:
    status: done
    comment: README "Entities created" section.
  docs-troubleshooting:
    status: done
    comment: README "Frequently asked questions" section.
  docs-use-cases:
    status: done
    comment: README introduction and "How does the self-tuning work?" section.
  dynamic-devices:
    status: done
    comment: >
      PV array subentries can be added, edited and removed after initial setup
      via the ArraySubEntryFlow.
  entity-category:
    status: done
    comment: >
      EntityCategory.CONFIG for number and switch entities;
      EntityCategory.DIAGNOSTIC for raw/PID-component sensors.
  entity-device-class:
    status: done
    comment: >
      SensorDeviceClass.POWER for grid and PID sensors (UnitOfPower.WATT).
      ZGCArraySetpointSensor uses a dynamic unit property: PERCENTAGE for
      percent-type arrays, UnitOfPower.WATT for watt-type, None for switch-type.
  entity-disabled-by-default:
    status: done
    comment: >
      _attr_entity_registry_enabled_default = False on ZGCGridRawSensor
      and ZGCPIDOutputSensor (diagnostic-only) and on all number entities
      (ZGCDeadbandNumber, ZGCFilterAlphaNumber — advanced tuning parameters).
  entity-translations:
    status: done
    comment: >
      All entities have _attr_translation_key; translations/en.json present.
  exception-translations:
    status: done
    comment: >
      _async_update_data wraps _run_control_cycle in try/except and raises
      UpdateFailed(translation_domain=DOMAIN,
      translation_key="coordinator_update_failed",
      translation_placeholders={"error": str(err)}).
      exceptions section present in strings.json and translations/en.json.
  icon-translations:
    status: done
    comment: icons.json with MDI icons for all entity types and services.
  reconfiguration-flow:
    status: done
    comment: >
      OptionsFlow for main settings; ArraySubEntryFlow.async_step_reconfigure
      for per-array reconfiguration.
  repair-issues:
    status: done
    comment: >
      repairs.py implements raise_grid_sensor_unavailable and dismiss_grid_sensor_unavailable
      using async_create_issue/async_delete_issue. ZeroGridCoordinator._async_update_data
      raises the issue on first unavailable cycle and dismisses it on recovery.
  stale-devices:
    status: done
    comment: >
      async_remove_config_entry_device returns True for devices whose subentry
      no longer exists.

  # Platinum
  async-dependency:
    status: done
    comment: >
      All I/O is async (hass.services.async_call, hass.states.get).
      No blocking calls in the event loop.
  inject-websession:
    status: exempt
    comment: No HTTP calls; integration reads local HA states only.
  strict-typing:
    status: done
    comment: mypy --strict passes with no issues on all 20 source files.

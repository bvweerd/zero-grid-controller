name: Create Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Build ZIP and create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Get version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Stamp the tag's version into the ZIP's manifest.json, so what the
      # Marketplace installs (hacs.json sets zip_release) reports the version
      # being released. The repository copy is left alone.
      - name: Stamp the released version into manifest.json
        run: |
          sed -i 's/"version": "[^"]*"/"version": "${{ steps.version.outputs.version }}"/' \
            custom_components/zero_grid_controller/manifest.json

      - name: Create release ZIP
        run: |
          cd custom_components/zero_grid_controller/
          zip ../../zero-grid-controller.zip -r ./

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          commitMode: true
          configuration: |
            {
              "label_extractor": [
                { "pattern": "^(feat|feature|add)(\\(.+\\))?!?[:\\s]", "target": "feature" },
                { "pattern": "^(fix|bug|bugfix|hotfix)(\\(.+\\))?!?[:\\s]", "target": "bug" },
                { "pattern": "^(docs?|documentation)(\\(.+\\))?[:\\s]", "target": "documentation" },
                { "pattern": "^(ci|github.?actions?)(\\(.+\\))?[:\\s]", "target": "ci" },
                { "pattern": "^(chore|refactor|test|perf|style|build|bump)(\\(.+\\))?[:\\s]", "target": "chore" }
              ],
              "categories": [
                { "title": "## ✨ New features",   "labels": ["feature", "enhancement"] },
                { "title": "## 🐛 Bug fixes",      "labels": ["bug", "fix"] },
                { "title": "## 📚 Documentation",  "labels": ["documentation"] },
                { "title": "## 🔧 Other",           "labels": ["chore"] },
                { "title": "## 👷 CI",             "labels": ["ci"] },
                { "title": "## 📦 Uncategorized",  "labels": [] }
              ],
              "ignore_labels": ["dependabot"],
              "template": "#{{CHANGELOG}}\n\n**Full changelog**: #{{RELEASE_DIFF}}"
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: zero-grid-controller.zip
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ---

            ## Installation via the Marketplace
            On Home Assistant 2026.11 or later, install or update through Settings → Marketplace. On 2026.10 and older, use HACS. The new version is offered automatically (checked every 48 hours for repositories added from a link).

            ## Manual installation
            Download `zero-grid-controller.zip`, extract and copy `zero_grid_controller/` to your `custom_components/` directory.
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
